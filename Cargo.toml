[package]
name = "whisper"
version = "0.2.1"
edition = "2024"
description = "Ditado por voz minimalista: whisper.cpp com Vulkan, OSD Wayland, inserção na app focada"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
whisper-rs = { version = "0.16", features = ["vulkan"] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
tiny-skia = "0.11"
ab_glyph = "0.2"
dialoguer = "0.11"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
xkbcommon = "0.8"

[profile.release]
lto = true
