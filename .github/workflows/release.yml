# CI de release: quando uma release é publicada, builda o pacote do flake
# dentro do shell do devenv — que empurra os store paths para o cachix
# (luiseduardobatista) automaticamente. Suas máquinas NixOS então baixam o
# binário pronto do cache em vez de rebuildar.
name: release

on:
  release:
    types: [published]
  workflow_dispatch: # testar o pipeline na mão, sem criar release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Nix + caches: puxa do cache do devenv (acelera) e do nosso; com o
      # authToken, o modo daemon da action empurra os store paths construídos
      # no job para o luiseduardobatista automaticamente.
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: luiseduardobatista
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: devenv

      - name: Instala o devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      # Build dentro do shell do devenv (LIBCLANG_PATH etc. vêm do devenv.nix).
      # O push pro cachix é feito pelo cachix-action (daemon mode) acima.
      - name: Build do pacote
        shell: devenv shell bash -- -e {0}
        run: nix build .#default --accept-flake-config
